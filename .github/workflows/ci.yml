name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/learning_platform_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/learning_platform_ci
      EMAIL_FROM: "Learning Platform CI <ci@example.com>"
      MUX_TOKEN_ID: ci_mux_token_id
      MUX_TOKEN_SECRET: ci_mux_token_secret
      MUX_WEBHOOK_SECRET: ci_mux_webhook_secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      RESEND_API_KEY: re_ci_only
      STRIPE_SECRET_KEY: sk_test_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_key
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm check
